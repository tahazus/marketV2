<header x-data="{ open: false }" class="w-full border-b border-neutral-800">
    <nav aria-label="منوی اصلی" class="mx-auto flex h-16 w-full max-w-4xl items-center px-4">
        <div class="flex w-full items-center justify-between">

            <!-- Logo -->
            <a href="/" class="text-3xl text-white transition-colors hover:text-[#A78BFA] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400" aria-label="صفحه اصلی تاز">
                تـــاز
            </a>

            <!-- Desktop Menu -->
            <div class="hidden items-center gap-10 text-[#A1A1AA] lg:flex">
                <a href="blog.html" class="transition-colors hover:text-[#A78BFA] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400">
                    بلاگ
                </a>

                <a href="rules.html" class="transition-colors hover:text-[#A78BFA] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400">
                    قوانین
                </a>

                <a href="contactus.html" class="transition-colors hover:text-[#A78BFA] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400">
                    ارتباط
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button type="button" @click="open = !open" :aria-expanded="open.toString()" aria-controls="mobile-menu" :aria-label="open ? 'بستن منو' : 'باز کردن منو'"
                class="inline-flex items-center justify-center rounded-lg p-2 text-neutral-400 transition-colors hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400 lg:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

        </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobile-menu" x-cloak x-show="open" x-transition @click.outside="open = false" class="absolute left-0 right-0 z-50 border-t border-[#2E2E3F] bg-[#1E1E2A] lg:hidden">
        <nav aria-label="منوی موبایل" class="mx-auto flex w-full max-w-4xl flex-col gap-1 px-4 py-3 text-center text-[#A1A1AA]">
            <a href="blog.html" @click="open = false" class="rounded-lg py-3 transition-colors hover:bg-white/5 hover:text-[#E4E4E7] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400">
                بلاگ
            </a>

            <a href="rules.html" @click="open = false" class="rounded-lg py-3 transition-colors hover:bg-white/5 hover:text-[#E4E4E7] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400">
                قوانین
            </a>

            <a href="contactus.html" @click="open = false" class="rounded-lg py-3 transition-colors hover:bg-white/5 hover:text-[#E4E4E7] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-400">
                ارتباط
            </a>
        </nav>
    </div>
</header>
